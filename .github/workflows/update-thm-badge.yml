name: Update TryHackMe Badge

# allow the workflow to push changes
permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Configure Git Identity
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Refresh and download TryHackMe badge
      run: |
        mkdir -p assets
        curl --fail --location --retry 3 \
          "https://tryhackme.com/badge/regen/5796025"
        curl --fail --location --retry 3 \
          "https://tryhackme-badges.s3.amazonaws.com/oxce5.png" \
          --output assets/tryhackme-badge.png

    - name: Commit and push badge if changed
      run: |
        git add assets/tryhackme-badge.png
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        git commit -m "Updated THM profile badge"
        git push origin "HEAD:${{ github.ref_name }}"
